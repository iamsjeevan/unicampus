# .github/workflows/frontend-ci.yml
name: Frontend CI

on:
  # Trigger on pushes to the frontend-dev branch
  push:
    branches:
      - frontend-dev
    paths:
      - 'frontend/UnicampusApp/**' # Only run if files inside the RN app change

  # Trigger on Pull Requests targeting the frontend-dev branch
  pull_request:
    branches:
      - frontend-dev
    paths:
      - 'frontend/UnicampusApp/**' # Only run if files inside the RN app change

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_and_lint:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        # Set the default working directory for all run steps in this job
        working-directory: ./frontend/UnicampusApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Use Node.js 18.x LTS
          cache: 'npm' # Enable caching for npm dependencies
          cache-dependency-path: frontend/UnicampusApp/package-lock.json # Specify path for cache key

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Use Eclipse Temurin distribution
          java-version: '17'

      # Note: Android SDK setup is needed for 'build' but not strictly for 'lint' or 'test'
      # We'll skip the full SDK setup for now to keep this initial CI simpler.
      # Add Android SDK setup steps here if you need to run './gradlew' commands later.

      - name: Install JavaScript dependencies
        run: npm ci # Use 'ci' for clean installs in CI

      - name: Lint code (Example)
        # Add your linting command here if you have one configured
        # Example: run: npm run lint
        # If no lint script exists yet, you can skip or comment out this step
        run: echo "Linting step placeholder - add 'npm run lint' if configured"

      # Add other checks like type checking (tsc) or unit tests (npm test) here if needed

      # Optional: Add an Android Debug Build step later if desired
      # Requires full Android SDK setup and license acceptance
      # - name: Build Android Debug APK
      #   run: |
      #     cd android
      #     ./gradlew assembleDebug --no-daemon
